<h3>Famous Equations</h3>
<div class='math-list'>
    <h4><a href="https://en.wikipedia.org/wiki/Sophie_Germain%27s_identity" target="_blank">1. Germain's Identity</a>
    </h4>
    <p>A factorization identity.</p>
    $$ a^4 + 4b^4 = (a^2 + 2b^2 + 2ab)(a^2 + 2b^2 - 2ab) $$

    <h4><a href="https://en.wikipedia.org/wiki/Sophie_Germain_prime" target="_blank">2. Sophie Germain Primes</a></h4>
    <p>A prime \(p\) where \(2p+1\) is also prime, crucial in her work on Fermat's Last Theorem.</p>
    $$ p \in \mathbb{P}, \quad 2p+1 \in \mathbb{P} $$
</div>
