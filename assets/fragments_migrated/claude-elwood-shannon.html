<h3>Famous Equations</h3>
<div class='math-list'>
    <h4><a href="https://en.wikipedia.org/wiki/Entropy_(information_theory)" target="_blank">1. Information Entropy</a>
    </h4>
    <p>The measure of uncertainty or information content in a source.</p>
    $$ H(X) = - \sum_{i} P(x_i) \log_2 P(x_i) $$

    <h4><a href="https://en.wikipedia.org/wiki/Noisy-channel_coding_theorem" target="_blank">2. Channel Capacity</a>
    </h4>
    <p>The upper bound on the rate of information transmission.</p>
    $$ C = B \log_2\left(1 + \frac{S}{N}\right) $$
</div>
