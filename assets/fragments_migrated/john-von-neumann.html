<h3>Famous Equations</h3>
<div class='math-list'>
    <h4><a href="https://en.wikipedia.org/wiki/Von_Neumann_entropy" target="_blank">1. Von Neumann Entropy</a></h4>
    <p>Extension of classical entropy to quantum mechanics.</p>
    $$ S(\rho) = -\text{Tr}(\rho \ln \rho) $$

    <h4><a href="https://en.wikipedia.org/wiki/Minimax_theorem" target="_blank">2. Minimax Theorem</a></h4>
    <p>The foundation of game theory.</p>
    $$ \max_x \min_y v(x, y) = \min_y \max_x v(x, y) $$
</div>
