<h3>Famous Equations</h3>
<div class='math-list'>
    <h4><a href="https://en.wikipedia.org/wiki/Poisson_distribution" target="_blank">1. Poisson Distribution</a></h4>
    <p>Probability of a given number of events occurring in a fixed interval.</p>
    $$ P(k) = \frac{\lambda^k e^{-\lambda}}{k!} $$

    <h4><a href="https://en.wikipedia.org/wiki/Poisson%27s_equation" target="_blank">2. Poisson Equation</a></h4>
    <p>Generalization of Laplace's equation for systems with charge/mass density.</p>
    $$ \nabla^2 \varphi = f $$
