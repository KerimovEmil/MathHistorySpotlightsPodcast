    <h4><a href="https://en.wikipedia.org/wiki/Wallis_product" target="_blank">1. Wallis Product</a></h4>
    <p>An infinite product for \(\pi\) involving only rational numbers.</p>
    $$ \frac{\pi}{2} = \prod_{n=1}^\infty \left( \frac{2n}{2n-1} \cdot \frac{2n}{2n+1} \right) = \frac{2}{1} \cdot
    \frac{2}{3} \cdot \frac{4}{3} \cdot \frac{4}{5} \dots $$
</div>
