<h3>Famous Equations</h3>
<div class='math-list'>
    <h4>1. Jacobian Determinant</h4>
    <p>Used for changing variables in multiple integrals.</p>
    $$ J = \det \frac{\partial(y_1, \dots, y_n)}{\partial(x_1, \dots, x_n)} $$

    <h4>2. Jacobi Identity</h4>
    <p>A property of the Poisson bracket and Lie algebras.</p>
    $$ [A, [B, C]] + [B, [C, A]] + [C, [A, B]] = 0 $$
</div>
