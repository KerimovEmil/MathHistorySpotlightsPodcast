<h3>Famous Equations</h3>
<div class='math-list'>
    <h4><a href="https://en.wikipedia.org/wiki/Laplace%27s_equation" target="_blank">1. Laplace Equation</a></h4>
    <p>Describes potentials in physics.</p>
    $$ \nabla^2 \varphi = 0 $$

    <h4><a href="https://en.wikipedia.org/wiki/Laplace_transform" target="_blank">2. Laplace Transform</a></h4>
    <p>Transforms differential equations into algebraic ones.</p>
    $$ F(s) = \int_0^\infty f(t) e^{-st} dt $$
