    <h4><a href="https://en.wikipedia.org/wiki/De_Morgan%27s_laws" target="_blank">1. De Morgan's Laws</a></h4>
    <p>Fundamental rules of logic and set theory relating conjunctions and disjunctions.</p>
    $$ \neg(A \land B) \iff (\neg A) \lor (\neg B) $$
    $$ \neg(A \lor B) \iff (\neg A) \land (\neg B) $$
