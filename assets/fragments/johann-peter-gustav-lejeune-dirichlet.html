    <h4><a href="https://en.wikipedia.org/wiki/Dirichlet_series" target="_blank">1. Dirichlet Series</a></h4>
    <p>A generalization of the Zeta function.</p>
    $$ F(s) = \sum_{n=1}^\infty \frac{a_n}{n^s} $$

    <h4><a href="https://en.wikipedia.org/wiki/Class_number_formula" target="_blank">2. Class Number Formula</a></h4>
    <p>Relating algebraic number theory quantities to L-function values.</p>
    $$ h = \frac{w\sqrt{|D|}}{2\pi} L(1, \chi) $$
