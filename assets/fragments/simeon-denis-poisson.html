<h3>Famous Equations</h3>
<div class='math-list'>
    <h4>1. Poisson Distribution</h4>
    <p>Probability of a given number of events occurring in a fixed interval.</p>
    $$ P(k) = \frac{\lambda^k e^{-\lambda}}{k!} $$

    <h4>2. Poisson Equation</h4>
    <p>Generalization of Laplace's equation for systems with charge/mass density.</p>
    $$ \nabla^2 \varphi = f $$
