<h3>Famous Equations</h3>
<div class='math-list'>
    <h4><a href="https://en.wikipedia.org/wiki/Pascal%27s_rule" target="_blank">1. Pascal's Identity</a></h4>
    <p>The recurrence relation defining Pascal's Triangle.</p>
    $$ \binom{n}{k} = \binom{n-1}{k-1} + \binom{n-1}{k} $$

    <h4><a href="https://en.wikipedia.org/wiki/Pascal%27s_law" target="_blank">2. Principle of Hydrostatics</a></h4>
    <p>Pascal's law regarding pressure in a fluid.</p>
    $$ \Delta P = \rho g \Delta h $$
