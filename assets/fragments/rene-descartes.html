    <h4><a href="https://en.wikipedia.org/wiki/Descartes%27_rule_of_signs" target="_blank">1. Descartes' Rule of
            Signs</a></h4>
    <p>Determines the number of positive real roots of a polynomial.</p>
    $$ v - p = 2k $$

    <h4><a href="https://en.wikipedia.org/wiki/Euler_characteristic" target="_blank">2. Polyhedral Formula</a></h4>
    <p>A precursor to Euler's formula for polyhedra.</p>
    $$ \sum (V - 2) = 2(F - 4) $$
